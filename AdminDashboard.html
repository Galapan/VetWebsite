<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>Dashboard Admin - Veterinaria JOBSA</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="src/output.css" />
    <link rel="stylesheet" href="src/input.css" />
  </head>

  <body class="admin-dashboard">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-100">
      <nav
        class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-4">
          <div
            class="w-10 h-10 rounded-full bg-white shadow flex items-center justify-center overflow-hidden"
          >
            <img
              src="img/Golden-Retriever.webp"
              class="w-full h-full object-cover"
              alt="Logo"
            />
          </div>
          <div>
            <div class="font-semibold text-gray-900">Veterinaria JOBSA</div>
            <div class="text-xs text-gray-500">Sistema de Gestión de Citas</div>
          </div>
        </div>

        <a href="index.html" class="back-to-site">
          <i class="fa-solid fa-house text-xs"></i>
          <span>Volver al Sitio</span>
        </a>
      </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
      <!-- Page Title -->
      <div class="mb-8">
        <h1 class="text-3xl font-semibold text-gray-900 mb-2">
          Gestión de Citas
        </h1>
        <p class="text-gray-600">Ver y gestionar todas las citas programadas</p>
      </div>

      <!-- Stats Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div class="stat-card">
          <div class="flex items-center justify-between mb-3">
            <span class="text-gray-600 text-sm">Total de Citas</span>
            <div
              class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center"
            >
              <i class="fa-solid fa-calendar text-blue-600"></i>
            </div>
          </div>
          <div class="text-3xl font-bold text-gray-900" id="total-appointments">
            0
          </div>
        </div>

        <div class="stat-card">
          <div class="flex items-center justify-between mb-3">
            <span class="text-gray-600 text-sm">Pendientes</span>
            <div
              class="w-10 h-10 rounded-lg bg-yellow-50 flex items-center justify-center"
            >
              <i class="fa-solid fa-clock text-yellow-600"></i>
            </div>
          </div>
          <div
            class="text-3xl font-bold text-yellow-600"
            id="pending-appointments"
          >
            0
          </div>
        </div>

        <div class="stat-card">
          <div class="flex items-center justify-between mb-3">
            <span class="text-gray-600 text-sm">Confirmadas</span>
            <div
              class="w-10 h-10 rounded-lg bg-green-50 flex items-center justify-center"
            >
              <i class="fa-solid fa-check-circle text-green-600"></i>
            </div>
          </div>
          <div
            class="text-3xl font-bold text-green-600"
            id="confirmed-appointments"
          >
            0
          </div>
        </div>

        <div class="stat-card">
          <div class="flex items-center justify-between mb-3">
            <span class="text-gray-600 text-sm">Canceladas</span>
            <div
              class="w-10 h-10 rounded-lg bg-red-50 flex items-center justify-center"
            >
              <i class="fa-solid fa-times-circle text-red-600"></i>
            </div>
          </div>
          <div
            class="text-3xl font-bold text-red-600"
            id="canceled-appointments"
          >
            0
          </div>
        </div>
      </div>

      <!-- Filters Section -->
      <div class="bg-white rounded-xl p-6 shadow-sm mb-6">
        <div
          class="flex flex-col md:flex-row gap-4 items-center justify-between"
        >
          <div class="relative flex-1 w-full">
            <i
              class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"
            ></i>
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Buscar por nombre del dueño, mascota o fecha..."
            />
          </div>

          <select id="status-filter" class="filter-select">
            <option value="all">Todos los Estados</option>
            <option value="pending">Pendientes</option>
            <option value="confirmed">Confirmadas</option>
            <option value="canceled">Canceladas</option>
          </select>
        </div>
      </div>

      <!-- Appointments Table -->
      <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="p-6 border-b border-gray-100">
          <h2 class="text-lg font-semibold text-gray-900">Citas Programadas</h2>
        </div>

        <div class="overflow-x-auto">
          <table>
            <thead>
              <tr>
                <th>Nombre del Dueño</th>
                <th>Mascota</th>
                <th>Servicio</th>
                <th>Fecha y Hora</th>
                <th>Contacto</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="appointments-table">
              <!-- Los datos se cargarán dinámicamente -->
              <tr>
                <td colspan="7" class="text-center py-12">
                  <i
                    class="fa-solid fa-spinner fa-spin text-2xl text-gray-400 mb-3"
                  ></i>
                  <p class="text-gray-500">Cargando citas...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <script src="backend/Dashboard.js"></script>
  </body>
</html>
